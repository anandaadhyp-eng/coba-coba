<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeri Kenangan Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#fff4f0; --bg2:#ffe3ec; --ink:#4a2c3a; --soft:#8a6475; --card:#fffdfb;
  --pink:#ff8fb1; --yellow:#ffd666; --blue:#8ecbff; --green:#9be0b0; --purple:#c3a6ff; --peach:#ffb48a;
  --shadow:rgba(120,50,80,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#241822; --bg2:#33202e; --ink:#ffe9f1; --soft:#c9a3b5; --card:#3a2736; --shadow:rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:'Patrick Hand','Baloo 2',ui-rounded,'Comic Sans MS',sans-serif;font-size:18px;overflow-x:hidden}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters span{position:absolute;bottom:-60px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 18px 80px}
header{text-align:center;margin-bottom:22px}
h1{font-family:'Baloo 2',ui-rounded,sans-serif;font-weight:700;font-size:clamp(2rem,7vw,3.4rem);margin:0;line-height:1.1}
h1 .bounce{display:inline-block;animation:bob 1.8s ease-in-out infinite}
h1 .bounce:nth-child(2n){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
header p{margin:8px 0 0;color:var(--soft)}
.drop{display:block;margin:0 auto 30px;max-width:460px;text-align:center;padding:22px 16px;border:3px dashed var(--pink);border-radius:28px;background:var(--card);cursor:pointer;transition:transform .2s;box-shadow:0 8px 20px var(--shadow)}
.drop:hover,.drop.over{transform:scale(1.04) rotate(-1deg)}
.drop b{font-family:'Baloo 2',sans-serif;font-size:1.3rem;display:block}
.drop small{color:var(--soft)}
.drop .plus{font-size:2.2rem;display:block;animation:bob 2s ease-in-out infinite}
input[type=file]{display:none}
.play{display:block;margin:-6px auto 26px;border:0;border-radius:99px;padding:12px 26px;font:700 1.15rem 'Baloo 2',ui-rounded,sans-serif;color:#fff;background:linear-gradient(135deg,#ff8fb1,#c3a6ff);cursor:pointer;box-shadow:0 8px 20px var(--shadow);transition:transform .2s;animation:bob 2.4s ease-in-out infinite}
.play:hover{transform:scale(1.08) rotate(-2deg)}
#status{text-align:center;color:var(--soft);min-height:1.4em;margin:-14px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 26px;padding-top:8px}
.item{position:relative;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;transform:rotate(var(--r,0deg));transition:transform .25s}
.item:nth-child(3n+1){--r:-2deg}.item:nth-child(3n+2){--r:1.5deg}.item:nth-child(3n){--r:-1deg}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.item:hover{transform:rotate(0) scale(1.05) translateY(-4px);z-index:3}

/* ===== BINGKAI LUCU ===== */
.frame{--c:var(--pink);--e:'💗';position:relative;background:var(--card);border:10px solid var(--c);padding:8px 8px 10px;border-radius:22px;box-shadow:0 10px 22px var(--shadow)}
.frame::after{content:var(--e);position:absolute;top:-26px;right:-14px;font-size:2rem;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 2px var(--shadow))}
.frame::before{content:var(--e2,'');position:absolute;bottom:34px;left:-22px;font-size:1.5rem;animation:bob 2.6s .5s ease-in-out infinite}
.f0{--c:var(--pink);--e:'💗';--e2:'🎀'}
.f1{--c:var(--yellow);--e:'⭐';--e2:'✨';border-radius:6px;border-style:double;border-width:12px}
.f2{--c:var(--blue);--e:'☁️';--e2:'💧';border-radius:46px 46px 30px 30px}
.f3{--c:#fff;--e:'📌';--e2:'';border-radius:4px;border-width:12px 12px 36px;box-shadow:0 10px 24px var(--shadow),0 0 0 2px var(--yellow) inset}
.f4{--c:var(--green);--e:'🌼';--e2:'🌱';border-style:dotted;border-width:12px;border-radius:30px}
.f5{--c:var(--purple);--e:'🦋';--e2:'💜';border-style:ridge;border-radius:50% 50% 24px 24px / 22% 22% 24px 24px}
.f6{--c:var(--peach);--e:'🍓';--e2:'🍃';border-style:dashed;border-radius:18px}

.media{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#0002;cursor:zoom-in}
video.media{cursor:auto}
.date{margin:8px 2px 0;text-align:center;font-family:'Baloo 2',sans-serif;font-size:.98rem;color:var(--soft)}
.tools{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .2s}
.item:hover .tools,.item:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools button{border:0;border-radius:99px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;background:var(--card);box-shadow:0 3px 8px var(--shadow);transition:transform .15s}
.tools button:hover{transform:scale(1.2) rotate(8deg)}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:30px 0}
.empty span{font-size:3rem;display:block;animation:bob 2s infinite}

/* ===== FOTO DIBESARKAN ===== */
#lb{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:18px;border:8px solid var(--pink)}

/* ===== ANIMASI GULIR BAWAH KE ATAS ===== */
#ss{position:fixed;inset:0;z-index:60;display:none;background:#2a1824;color:#ffe9f1;overflow:hidden}
#ss.on{display:block}
#ssStage{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.reel{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:56px;padding:100vh 0 20vh;will-change:transform}
.reel .frame{max-width:88vw}
.reel .media{aspect-ratio:auto;width:min(72vw,380px);height:auto;max-height:70vh;object-fit:contain;cursor:default}
.reel .date{font-size:1.1rem;color:var(--ink)}
#ssBar{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#ff8fb1,#ffd666);transform:scaleX(0);transform-origin:left;z-index:3}
.ssctl{position:absolute;z-index:4;left:0;right:0;top:14px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none}
.ssctl>*{pointer-events:auto}
.ssbtns{position:absolute;z-index:4;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px}
#ss button{border:0;border-radius:99px;min-width:46px;height:46px;font-size:1.2rem;cursor:pointer;background:#ffffff26;color:#fff;transition:transform .15s}
#ss button:hover{transform:scale(1.15)}
#ssCount{font-family:'Baloo 2',sans-serif;opacity:.85}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
</style>
</head>
<body>
<div class="floaters" id="fl" aria-hidden="true"></div>
<main>
  <header>
    <h1 id="ttl">Galeri Kenangan Kita</h1>
    <p>Semua foto &amp; videomu tersimpan otomatis di perangkat ini 💕</p>
  </header>

  <label class="drop" id="drop" tabindex="0">
    <span class="plus">📸</span>
    <b>Tambah foto / video</b>
    <small>Klik di sini atau tarik file ke sini</small>
    <input type="file" id="file" accept="image/*,video/*" multiple>
  </label>
  <button class="play" id="play" type="button">▶️ Putar kenangan</button>
  <div id="status" role="status"></div>

  <section class="grid" id="grid" aria-live="polite"></section>
</main>

<div id="lb"><img alt="Foto ukuran besar"></div>

<div id="ss" role="dialog" aria-label="Animasi kenangan">
  <div id="ssBar"></div>
  <div id="ssStage"></div>
  <div class="ssctl"><span id="ssCount"></span><button id="ssClose" type="button" aria-label="Tutup">✕</button></div>
  <div class="ssbtns">
    <button id="ssPrev" type="button" aria-label="Geser turun">◀</button>
    <button id="ssPause" type="button" aria-label="Jeda">⏸</button>
    <button id="ssNext" type="button" aria-label="Geser naik">▶</button>
  </div>
</div>

<script>
// ============================================================
//  GANTI LAGU DI SINI 🎵
//  Cara 1: taruh file lagu satu folder dengan file HTML ini, lalu tulis namanya
//          contoh: var LAGU_URL = "lagu-kita.mp3";
//  Cara 2: pakai link langsung ke file lagu (harus berakhiran .mp3 / .m4a)
//          contoh: var LAGU_URL = "https://situsmu.com/lagu.mp3";
//  Kosongkan ("") kalau tidak mau pakai lagu.
// ============================================================
var LAGU_URL = "https://j.top4top.io/m_394987e5j0.mp3";

// ---------- Judul animasi & emoji melayang ----------
(function(){
  var t=document.getElementById('ttl'),s=t.textContent;t.textContent='';
  s.split('').forEach(function(ch){var e=document.createElement('span');e.className='bounce';e.textContent=ch===' '?'\u00a0':ch;t.appendChild(e);});
  var fl=document.getElementById('fl'),em=['💗','⭐','🌸','✨','🦋','🍓','☁️','💛'];
  for(var i=0;i<14;i++){var e=document.createElement('span');e.textContent=em[i%em.length];
    e.style.left=Math.random()*100+'%';e.style.fontSize=(16+Math.random()*22)+'px';
    e.style.animationDuration=(14+Math.random()*16)+'s';e.style.animationDelay=(-Math.random()*20)+'s';fl.appendChild(e);}
})();

var FRAMES=7, db=null, mem=[], urls={};
var grid=document.getElementById('grid'), statusEl=document.getElementById('status');
function say(m){statusEl.textContent=m||'';}

// ---------- Penyimpanan permanen (IndexedDB) ----------
function openDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('galeri-kenangan',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('items',{keyPath:'id'});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){res(null);};
    }catch(e){res(null);}
  });
}
function tx(mode,fn){
  return new Promise(function(res,rej){
    var t=db.transaction('items',mode),st=t.objectStore('items'),out=fn(st);
    t.oncomplete=function(){res(out&&out.result);};t.onerror=t.onabort=function(){rej(t.error);};
  });
}
function load(){
  if(!db)return Promise.resolve(mem);
  return tx('readonly',function(st){return st.getAll();});
}
function save(it){ if(!db){mem.push(it);return Promise.resolve();} return tx('readwrite',function(st){st.put(it);}); }
function remove(id){ if(!db){mem=mem.filter(function(x){return x.id!==id;});return Promise.resolve();} return tx('readwrite',function(st){st.delete(id);}); }

function fmt(ts){
  var d=new Date(ts);
  return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+' · '+
         d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');
}
function mediaUrl(it){return urls[it.id]||(urls[it.id]=URL.createObjectURL(it.blob));}
function newest(list){return (list||[]).slice().sort(function(a,b){return b.ts-a.ts;});}

// ---------- Galeri ----------
function render(){
  load().then(function(list){
    list=newest(list);
    grid.textContent='';
    if(!list.length){
      var e=document.createElement('div');e.className='empty';
      e.innerHTML='<span>🧸</span>Belum ada kenangan. Yuk tambah yang pertama!';
      grid.appendChild(e);return;
    }
    list.forEach(function(it,i){
      var u=mediaUrl(it);
      var w=document.createElement('article');w.className='item';w.style.animationDelay=(i*70)+'ms';
      var f=document.createElement('div');f.className='frame f'+(it.frame%FRAMES);
      var m;
      if(it.type==='video'){m=document.createElement('video');m.controls=true;m.playsInline=true;m.preload='metadata';m.src=u;}
      else{m=document.createElement('img');m.src=u;m.alt='Kenangan '+fmt(it.ts);m.loading='lazy';
        m.onclick=function(){var lb=document.getElementById('lb');lb.querySelector('img').src=u;lb.classList.add('on');};}
      m.className='media';
      var d=document.createElement('div');d.className='date';d.textContent='📅 '+fmt(it.ts);
      f.appendChild(m);f.appendChild(d);
      var tl=document.createElement('div');tl.className='tools';
      var b1=document.createElement('button');b1.textContent='🎀';b1.title='Ganti bingkai';b1.setAttribute('aria-label','Ganti bingkai');
      b1.onclick=function(){it.frame=(it.frame+1)%FRAMES;save(it).then(render);};
      var b2=document.createElement('button');b2.textContent='🗑️';b2.title='Hapus';b2.setAttribute('aria-label','Hapus');
      b2.onclick=function(){if(confirm('Hapus kenangan ini?')){URL.revokeObjectURL(urls[it.id]);delete urls[it.id];remove(it.id).then(render);}};
      tl.appendChild(b1);tl.appendChild(b2);
      w.appendChild(f);w.appendChild(tl);grid.appendChild(w);
    });
  });
}

function addFiles(files){
  var arr=Array.prototype.filter.call(files,function(f){return /^(image|video)\//.test(f.type);});
  if(!arr.length){say('Pilih file foto atau video ya 🙂');return;}
  say('Menyimpan… ✨');
  var now=Date.now();
  arr.reduce(function(p,f,i){
    return p.then(function(){
      return save({id:now+'-'+i+'-'+Math.random().toString(36).slice(2,7),type:f.type.indexOf('video')===0?'video':'image',
        blob:f,name:f.name,ts:now+i,frame:Math.floor(Math.random()*FRAMES)});
    });
  },Promise.resolve()).then(function(){say('Tersimpan! 💾 '+arr.length+' kenangan baru');setTimeout(say,2500);render();})
  .catch(function(){say('Gagal menyimpan. Penyimpanan perangkat mungkin penuh.');});
}

var fi=document.getElementById('file'),dr=document.getElementById('drop');
fi.onchange=function(){addFiles(fi.files);fi.value='';};
dr.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();}});
['dragenter','dragover'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.add('over');});});
['dragleave','drop'].forEach(function(n){dr.addEventListener(n,function(e){e.preventDefault();dr.classList.remove('over');});});
dr.addEventListener('drop',function(e){addFiles(e.dataTransfer.files);});
document.getElementById('lb').onclick=function(){this.classList.remove('on');};

// ---------- Animasi gulir bawah ke atas + lagu ----------
var ssEl=document.getElementById('ss'),ssStage=document.getElementById('ssStage'),ssBar=document.getElementById('ssBar'),
    ssCount=document.getElementById('ssCount'),ssPause=document.getElementById('ssPause');
var reel={y:0,raf:0,last:0,on:false,paused:false,el:null,speed:75}; // speed = kecepatan gulir (piksel per detik)

var audio=new Audio();audio.loop=true;audio.preload='auto';
if(LAGU_URL)audio.src=LAGU_URL;
audio.onerror=function(){if(LAGU_URL)say('Lagu tidak ditemukan. Cek isi LAGU_URL di bagian atas kode.');};
function stopMusic(){try{audio.pause();audio.currentTime=0;}catch(e){}}

function ssClose(){
  reel.on=false;cancelAnimationFrame(reel.raf);
  Array.prototype.forEach.call(ssStage.querySelectorAll('video'),function(v){v.pause();});
  stopMusic();
  ssEl.classList.remove('on');ssStage.textContent='';
}
function reelTick(t){
  if(!reel.on)return;
  var dt=Math.min(.05,((t-reel.last)/1000)||0);reel.last=t;
  if(!reel.paused)reel.y-=reel.speed*dt;
  var end=reel.el.offsetHeight-0.2*innerHeight;
  if(-reel.y>=end)reel.y=0; // selesai, ulang dari awal
  reel.el.style.transform='translate3d(0,'+reel.y+'px,0)';
  ssBar.style.transform='scaleX('+Math.max(0,Math.min(1,-reel.y/end))+')';
  reel.raf=requestAnimationFrame(reelTick);
}
function nudge(d){reel.y=Math.min(0,reel.y+d);}
function togglePause(){
  reel.paused=!reel.paused;
  ssPause.textContent=reel.paused?'▶️':'⏸';
  if(LAGU_URL){
    if(reel.paused)audio.pause();
    else{var p=audio.play();if(p&&p.catch)p.catch(function(){});}
  }
}

document.getElementById('play').onclick=function(){
  if(LAGU_URL){
    var p=audio.play();
    if(p&&p.catch)p.catch(function(){say('Browser menahan lagunya, tekan tombol ▶ di layar animasi.');});
  }
  load().then(function(list){
    list=newest(list);
    if(!list.length){stopMusic();say('Belum ada kenangan untuk diputar. Tambah dulu ya 🙂');return;}
    say('');
    ssStage.textContent='';
    var r=document.createElement('div');r.className='reel';
    list.forEach(function(it,i){
      var f=document.createElement('div');f.className='frame f'+(it.frame%FRAMES);
      f.style.transform='rotate('+(i%2?2.5:-2.5)+'deg)';
      var m,u=mediaUrl(it);
      if(it.type==='video'){m=document.createElement('video');m.muted=true;m.loop=true;m.autoplay=true;m.playsInline=true;m.src=u;
        m.addEventListener('loadeddata',function(){var p=m.play();if(p&&p.catch)p.catch(function(){});});}
      else{m=document.createElement('img');m.src=u;m.alt='';}
      m.className='media';
      var d=document.createElement('div');d.className='date';d.textContent='📅 '+fmt(it.ts);
      f.appendChild(m);f.appendChild(d);r.appendChild(f);
    });
    ssStage.appendChild(r);
    reel.el=r;reel.y=0;reel.paused=false;reel.on=true;reel.last=performance.now();
    ssPause.textContent='⏸';ssCount.textContent=list.length+' kenangan';
    ssEl.classList.add('on');
    cancelAnimationFrame(reel.raf);reel.raf=requestAnimationFrame(reelTick);
  });
};
document.getElementById('ssClose').onclick=ssClose;
ssPause.onclick=togglePause;
document.getElementById('ssNext').onclick=function(){nudge(-320);};
document.getElementById('ssPrev').onclick=function(){nudge(320);};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(ssEl.classList.contains('on'))ssClose();
    else document.getElementById('lb').classList.remove('on');
  }else if(e.key===' '&&ssEl.classList.contains('on')){e.preventDefault();togglePause();}
});

// ---------- Mulai ----------
openDB().then(function(d){
  db=d;
  if(!db)say('Penyimpanan permanen tidak tersedia di browser ini, kenangan akan hilang saat halaman ditutup.');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  render();
});
</script>
</body>
</html>
